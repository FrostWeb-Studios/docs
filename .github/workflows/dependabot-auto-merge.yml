name: Dependabot auto-merge

# Merge EVERY Dependabot PR automatically (org decision 2026-08-06).
#
# The org ruleset "Default branch protection (master)" requires a
# code-owner review; the Dependabot APP has a bypass on it, the
# workflow's GITHUB_TOKEN does not. So the merge is performed by
# Dependabot itself via a command comment — do not replace this with
# `gh pr merge` (silently strands PRs; see MuricaAPI #87 history).

on: pull_request_target

permissions:
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to merge
        run: gh pr comment "$PR_URL" --body "@dependabot squash and merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

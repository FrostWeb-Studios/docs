name: Dependabot auto-merge

# Merge EVERY Dependabot PR automatically (org decision 2026-08-06).
#
# History: the original version commented "@dependabot squash and merge",
# but Dependabot silently ignores command comments in this org — even from
# humans (no reaction, no reply; 2026-08-22 audit). Every PR that appeared
# to auto-merge had actually been merged by hand. So merge directly with
# LIVE_PROMOTE_PAT (org admin — bypasses the code-owner ruleset).
#
# pull_request_target runs in base-branch context: PR code is never checked
# out here, and org secrets are available even on Dependabot-actor events
# (plain pull_request would only get Dependabot-scoped secrets).

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        run: gh pr merge "$PR_URL" --squash --admin
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.LIVE_PROMOTE_PAT }}

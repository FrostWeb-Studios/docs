name: Dependabot auto-merge

# Merge EVERY Dependabot PR automatically (org decision 2026-08-06).
#
# History: the original version commented "@dependabot squash and merge",
# but Dependabot silently ignores command comments in this org — even from
# humans (no reaction, no reply; 2026-08-22 audit). Every PR that appeared
# to auto-merge had actually been merged by hand. So merge directly with
# LIVE_PROMOTE_PAT (org admin — bypasses the code-owner ruleset).
#
# pull_request_target runs in base-branch context: PR code is never checked
# out here, and org secrets are available even on Dependabot-actor events
# (plain pull_request would only get Dependabot-scoped secrets).

on: pull_request_target

permissions: {}

# 2026-10-12: merged through GitHub auto-merge instead of an immediate admin
# merge. The PR merges on its own once every check the org ruleset requires on
# master is green (ci.yml now runs on master PRs); the merge is performed as the
# org admin behind LIVE_PROMOTE_PAT, which the ruleset lets bypass the review
# requirement. Humans still need an approving review.

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # GitHub auto-merge does not use ruleset bypass: the PR must genuinely satisfy
      # the master rules. The org admin behind LIVE_PROMOTE_PAT is a maintainer of
      # both code-owner teams, so this review satisfies the review requirement;
      # auto-merge then merges once any required check is green.
      - name: Approve
        run: gh pr review "$PR_URL" --approve --body "Dependabot bump approved by the auto-merge workflow. Merges when checks are green."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.LIVE_PROMOTE_PAT }}
      - name: Merge when checks are green
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.LIVE_PROMOTE_PAT }}
